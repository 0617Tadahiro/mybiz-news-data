<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>Hotel Design Journal</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Design Journal" />
<style>
  :root{ --ink:#1a1a1a; --sub:#9aa0a6; --line:#ececec; --tag:#b0573a; --navy:#2e2b28; --chipbg:#f0f2f5; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#fff}
  body{font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;padding-bottom:96px}
  .serif{font-family:"Hiragino Mincho ProN","Noto Serif JP",serif}
  a{color:inherit}
  .wrap{max-width:720px;margin:0 auto}
  /* header */
  header{background:#fff;position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
  .htop{max-width:720px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between;padding:12px 16px 2px}
  .brand{font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;font-weight:700;font-size:21px;letter-spacing:.01em}
  .htop .up{font-size:11px;color:var(--sub)}
  .cattabs{max-width:720px;margin:0 auto;display:flex;gap:7px;overflow-x:auto;padding:8px 12px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .cattabs::-webkit-scrollbar{display:none}
  .cattabs button{white-space:nowrap;border:0;background:var(--chipbg);color:#444;font-size:14px;font-weight:700;padding:7px 16px;border-radius:20px;cursor:pointer}
  .cattabs button.on{background:var(--navy);color:#fff}
  /* list rows */
  .list{max-width:720px;margin:0 auto;padding:0 16px}
  .item{display:flex;gap:12px;padding:16px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
  .item:active{opacity:.6}
  .item .txt{flex:1;min-width:0}
  .item .ttl{font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;font-weight:700;font-size:16.5px;line-height:1.45;margin:0 0 9px;color:#141414;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;transition:color .2s}
  /* 既読の記事は見出しを薄く */
  .item.read .ttl{color:#a9aeb5}
  .item.read .sub{color:#bcc1c7}
  .item .sub{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .item .tag{color:var(--tag);font-weight:700}
  .item .save-mini{margin-left:auto;border:0;background:none;font-size:18px;line-height:1;color:#cfd3d9;cursor:pointer}
  .item .save-mini.on{color:#e0a400}
  .thumb{width:96px;height:96px;border-radius:9px;object-fit:cover;flex-shrink:0;background:#e6e9ee}
  .phs{width:96px;height:96px;border-radius:9px;flex-shrink:0;display:flex;align-items:flex-end;padding:8px;color:#fff}
  .phs span{font-size:10px;font-weight:700;line-height:1.2;opacity:.95}
  /* detail */
  .detail{display:none;background:#fff;position:fixed;inset:0;overflow-y:auto;z-index:60;-webkit-overflow-scrolling:touch}
  .detail.on{display:block}
  .dhead{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;display:flex;align-items:center;gap:8px}
  .back{border:0;background:#f0f2f5;border-radius:10px;padding:8px 13px;font-size:14px;font-weight:700;cursor:pointer}
  .dwrap{max-width:720px;margin:0 auto;padding:0 0 60px}
  .dimg{width:100%;height:220px;object-fit:cover;display:block;background:#e6e9ee}
  .dph{width:100%;height:170px;display:flex;align-items:flex-end;padding:16px;color:#fff}
  .credit{font-size:10.5px;color:#b0b5bd;padding:6px 18px 0}
  .credit a{color:#9099a3;text-decoration:underline}
  .dcontent{padding:6px 18px 0}
  .dcat{display:inline-block;background:var(--chipbg);color:#39424f;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin-top:12px}
  .dtitle{font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;font-weight:700;font-size:23px;line-height:1.45;margin:10px 0 8px}
  .dmeta{font-size:12px;color:var(--sub);border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}
  .dsum{background:#f8f9fb;border-left:3px solid var(--navy);border-radius:6px;padding:12px 14px;font-size:14px;line-height:1.7;color:#2b323c;margin-bottom:18px}
  .body h2{font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;font-size:17px;border-left:4px solid var(--navy);padding-left:9px;margin:22px 0 8px}
  .body h3{font-size:15px;margin:16px 0 6px}
  .body p{font-size:14.5px;line-height:1.9;margin:0 0 12px;color:#2a3038}
  .body ul{padding-left:20px;margin:0 0 12px}
  .body li{font-size:14.5px;line-height:1.8;margin-bottom:4px}
  .sources{margin:18px 0;padding:14px;background:#f8f9fb;border-radius:10px}
  .sources h4{margin:0 0 8px;font-size:13px;color:var(--sub)}
  .sources a{display:block;font-size:13px;color:var(--tag);text-decoration:none;padding:4px 0;word-break:break-all}
  .actions{display:flex;gap:10px;margin:16px 0}
  .btn{flex:1;border:0;border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer}
  .btn-save{background:#fff;border:1.5px solid var(--navy);color:var(--navy)}
  .btn-save.on{background:var(--navy);color:#fff}
  .ai{margin:20px 0 10px;background:#f8f9fb;border:1px solid var(--line);border-radius:12px;padding:14px}
  .ai h4{margin:0 0 4px;font-size:14px}
  .ai .note{font-size:11px;color:#9aa2ad;margin:0 0 10px}
  .qchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .qchips button{background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 11px;font-size:12px;cursor:pointer;color:#39424f}
  .airow{display:flex;gap:8px}
  .airow input{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:14px;background:#fff}
  .airow button{border:0;background:var(--navy);color:#fff;border-radius:10px;padding:0 16px;font-size:14px;font-weight:700;cursor:pointer}
  .aians{margin-top:12px;font-size:14px;line-height:1.75;color:#2a3038;white-space:pre-wrap}
  .aians:empty{display:none}
  .thinking{color:#9aa2ad;font-size:13px}
  .empty{text-align:center;color:#9aa2ad;padding:70px 20px;font-size:14px}
  /* bottom floating nav */
  .bnav{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 10px);transform:translateX(-50%);background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);box-shadow:0 3px 14px rgba(0,0,0,.13);border-radius:24px;display:flex;gap:2px;padding:4px;z-index:80;transition:opacity .22s,transform .22s}
  .bnav button{border:0;background:none;display:flex;align-items:center;gap:5px;font-size:11.5px;color:#9aa0a6;padding:7px 13px;border-radius:20px;cursor:pointer;font-weight:700;white-space:nowrap}
  .bnav button .ic{font-size:14px;line-height:1}
  .bnav button.on{color:var(--navy);background:#eef1f6}
  /* 記事を開いている間・下スクロール中は隠す */
  .bnav.hide{opacity:0;transform:translateX(-50%) translateY(26px);pointer-events:none}
  .rg{font-size:10.5px;font-weight:700;color:#4f5a66;background:#eef1f4;padding:2px 7px;border-radius:10px;white-space:nowrap}
  .item.read .rg{opacity:.6}
  .otitle{font-size:12.5px;color:#7a828c;font-style:italic;margin:-2px 0 10px;line-height:1.5;word-break:break-word}
  .photobtn{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 18px 0;padding:11px;border-radius:12px;background:var(--navy);color:#fff;font-size:14px;font-weight:700;text-decoration:none}
  .facts{margin:0 0 16px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .facts div{display:flex;font-size:12.5px;line-height:1.55;border-top:1px solid var(--line)}
  .facts div:first-child{border-top:0}
  .facts b{flex:0 0 92px;background:#f7f5f2;color:#5b5752;font-weight:700;padding:7px 10px}
  .facts span{flex:1;padding:7px 10px;color:#2a2826;word-break:break-word}
  .imgkind{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;margin-right:4px;background:#eee;color:#666}
  .imgkind.real{background:#f3e3dc;color:#9a4a30}
  .thumbwrap{position:relative;width:96px;height:96px;border-radius:9px;overflow:hidden;flex-shrink:0}
  .thumbwrap .thumb{width:100%;height:100%;border-radius:0;display:block}
  .playbadge{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.62);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:2px 7px}
  .ytwrap{position:relative;width:100%;aspect-ratio:16/9;cursor:pointer;overflow:hidden}
  .ytwrap img{width:100%;height:100%;object-fit:cover;display:block}
  .ytplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:66px;height:46px;border-radius:12px;background:rgba(230,0,0,.9);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center}
  .ytframe{position:relative;width:100%;aspect-ratio:16/9;background:#000}
  .ytframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .embedwrap{padding:12px 10px 2px;background:#fafafa;min-height:120px}
  .gitem{margin:16px -18px 18px;padding:0}
  .gitem .credit{padding:6px 18px 0}
  .gitem .embedwrap{background:#faf8f5}
  .gcap{font-size:12.5px;color:#5f5a54;padding:7px 18px 0;line-height:1.55}
  .gtitle{font-size:14px;color:#5f5a54;margin:22px 0 4px}
  .qfig{margin:16px 0 18px;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fafafa}
  .qfig img{display:block;width:100%;height:auto;background:#eee}
  .qfig figcaption{padding:8px 12px 10px;font-size:12px;line-height:1.55;color:#5b6470}
  .qcap{display:block;color:#2a3038;font-weight:600;margin-bottom:3px}
  .qsrc a{color:var(--tag)}
  .qkind{display:inline-block;font-size:10px;font-weight:700;border:1px solid #c9ced6;border-radius:6px;padding:0 5px;margin-right:6px;color:#6b7480}
  .qfig.qhero{margin:0;border:0;border-radius:0;border-bottom:1px solid var(--line)}
  .efig{margin:16px -18px 18px;padding:0}
  .efig .credit{padding:6px 18px 0}
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 16px;border-radius:22px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:100}
  .toast.show{opacity:.95}
</style>
</head>
<body>
<header>
  <div class="htop"><div class="brand">Hotel Design Journal</div><div class="up" id="updated"></div></div>
  <div class="cattabs" id="cattabs"></div>
</header>

<div class="list" id="list"></div>

<div class="detail" id="detail">
  <div class="dhead"><button class="back" id="backBtn">← 一覧へ</button></div>
  <div class="dwrap" id="detailBody"></div>
</div>

<div class="bnav" id="bnav">
  <button id="navTop" class="on" onclick="setMode('feed')"><span class="ic">🏠</span>トップ</button>
  <button id="navSaved" onclick="setMode('saved')"><span class="ic">★</span>保存</button>
  <button onclick="load(true)"><span class="ic">⟳</span>更新</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* ====== 設定 ====== */
const DATA_URL   = "./articles.json";
const DATA_FALLBACK = "https://raw.githubusercontent.com/0617Tadahiro/mybiz-news-data/main/design/articles.json";
const AI_ENDPOINT = "https://weathered-cake-8d55mybiz-ai.617tadahiro-oka.workers.dev/";
const SAVE_KEY = "design_saved_v1";

const ALL_TAB = "すべて";
let ARTICLES = [], saved = loadSaved(), mode="feed", cat=ALL_TAB;

function loadSaved(){ try{ return JSON.parse(localStorage.getItem(SAVE_KEY)||"[]"); }catch(e){ return []; } }
function persist(){ localStorage.setItem(SAVE_KEY, JSON.stringify(saved)); }
function isSaved(id){ return saved.some(a=>a.id===id); }
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1600); }
function gradient(seed){ const h=[...(seed||"x")].reduce((a,c)=>a+c.charCodeAt(0),0); const a=h%360,b=(a+40)%360; return `linear-gradient(135deg,hsl(${a} 45% 32%),hsl(${b} 55% 22%))`; }
function ago(iso){ if(!iso)return""; const d=new Date(iso); const s=(Date.now()-d.getTime())/1000; if(isNaN(s))return ""; if(s<3600)return Math.max(1,Math.floor(s/60))+"分前"; if(s<86400)return Math.floor(s/3600)+"時間前"; return Math.floor(s/86400)+"日前"; }
function fmtd(iso){ if(!iso)return""; const d=new Date(iso); if(isNaN(d))return (iso||"").slice(0,10); return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`; }
function fmt(iso){ if(!iso)return""; const d=new Date(iso); if(isNaN(d))return iso.slice(0,10); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }

function md(src){
  const lines=(src||"").split(/\r?\n/); let html=""; let inList=false;
  const inline=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  for(let ln of lines){
    if(/^\s*##\s+/.test(ln)){ if(inList){html+="</ul>";inList=false;} html+="<h2>"+inline(ln.replace(/^\s*##\s+/,""))+"</h2>"; continue; }
    if(/^\s*###\s+/.test(ln)){ if(inList){html+="</ul>";inList=false;} html+="<h3>"+inline(ln.replace(/^\s*###\s+/,""))+"</h3>"; continue; }
    if(/^\s*[-・]\s+/.test(ln)){ if(!inList){html+="<ul>";inList=true;} html+="<li>"+inline(ln.replace(/^\s*[-・]\s+/,""))+"</li>"; continue; }
    if(/^\s*$/.test(ln)){ if(inList){html+="</ul>";inList=false;} continue; }
    if(inList){html+="</ul>";inList=false;}
    html+="<p>"+inline(ln)+"</p>";
  }
  if(inList)html+="</ul>";
  return html;
}

/* 掲載順に並べる＝「アプリに反映された順」。新しく載ったものが上、以前からあるものが下。
   同じ回に載ったものどうしは、その日の掲載順（データの並び）をそのまま保つ。 */
const SEEN_KEY = "design_seen_v1";
function loadSeen(){ try{ return JSON.parse(localStorage.getItem(SEEN_KEY)||"{}"); }catch(e){ return {}; } }
function sortByPublishedToApp(list, generatedAt){
  const seen = loadSeen();
  const batch = Date.parse(generatedAt||"") || Date.now();   // 今回アプリに載った時刻
  let changed = false;
  (list||[]).forEach(a=>{
    const key = a.headline || a.id;                          // idは毎回振り直されるので見出しで識別
    if(!(key in seen)){ seen[key] = batch; changed = true; } // 初めて見た＝今回反映された
  });
  if(changed){ try{ localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); }catch(e){} }
  return (list||[]).map((a,i)=>({a,i}))
    .sort((x,y)=>{
      const vx = seen[x.a.headline||x.a.id] || 0, vy = seen[y.a.headline||y.a.id] || 0;
      if(vx!==vy) return vy-vx;   // 後から載ったものが上
      return x.i-y.i;             // 同じ回なら、その日の掲載順のまま
    })
    .map(o=>o.a);
}

/* ====== データ ====== */
async function fetchData(url){ const r=await fetch(url+(url.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"}); if(!r.ok)throw new Error("HTTP "+r.status); return r.json(); }
async function load(showToast){
  try{
    let d; try{ d=await fetchData(DATA_URL); }catch(e){ d=await fetchData(DATA_FALLBACK); }
    ARTICLES=sortByPublishedToApp(d.articles||[], d.generated_at); localStorage.setItem("design_cache",JSON.stringify(d));
    document.getElementById("updated").textContent="最終更新 "+fmt(d.generated_at);
    buildTabs(); render(); if(showToast)toast("最新に更新しました");
  }catch(e){
    const c=localStorage.getItem("design_cache");
    if(c){ const j=JSON.parse(c); ARTICLES=sortByPublishedToApp(j.articles||[], j.generated_at); buildTabs(); render(); toast("オフライン：保存済みを表示"); }
    else { document.getElementById("list").innerHTML='<div class="empty">記事を読み込めませんでした。<br>通信環境を確認して「更新」を押してください。</div>'; }
  }
}
const CAT_ORDER = ["インテリア","建築・設計","コンセプト・企画","客室・共用部","運営×体験デザイン","デザイナー・事務所","アワード・トレンド","サステナブル","アート・ブランド"];
function buildTabs(){
  const found=[...new Set(ARTICLES.map(a=>a.category).filter(Boolean))].filter(c=>c!==ALL_TAB);
  found.sort((a,b)=>{
    const ia=CAT_ORDER.indexOf(a), ib=CAT_ORDER.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib);   // 決めた順→未知のものは後ろ
  });
  const cats=[ALL_TAB,...found];
  if(!cats.includes(cat)) cat=ALL_TAB;   // 前回のタブが無くなっていたら「すべて」に戻す
  document.getElementById("cattabs").innerHTML=cats.map(c=>{
    const n = c===ALL_TAB ? ARTICLES.length : ARTICLES.filter(a=>a.category===c).length;
    return `<button class="${c===cat?'on':''}" onclick="setCat('${esc(c)}')">${esc(c)} <span style="opacity:.55;font-weight:600">${n}</span></button>`;
  }).join("");
}
function setCat(c){ cat=c; buildTabs(); render(); window.scrollTo(0,0); }
function setMode(m){
  mode=m;
  document.getElementById("navTop").classList.toggle("on",m==="feed");
  document.getElementById("navSaved").classList.toggle("on",m==="saved");
  document.getElementById("cattabs").style.display = m==="feed" ? "flex" : "none";
  render(); window.scrollTo(0,0);
}

/* ====== 一覧（日経ふう：見出し左・写真右） ====== */
/* 既読の管理（見出しで識別。idは毎回振り直されるため） */
const READ_KEY = "design_read_v1";
function loadRead(){ try{ return JSON.parse(localStorage.getItem(READ_KEY)||"[]"); }catch(e){ return []; } }
let readList = loadRead();
function isRead(a){ return readList.includes(a.headline||a.id); }
function markRead(a){
  const key = a.headline||a.id;
  if(!readList.includes(key)){
    readList.push(key);
    if(readList.length>500) readList = readList.slice(-500);   // 増えすぎ防止
    try{ localStorage.setItem(READ_KEY, JSON.stringify(readList)); }catch(e){}
  }
}

function regionBadge(a){
  const r=(a.region||"").trim();
  if(!r) return "";
  const icon = r==="国内" ? "🇯🇵" : "🌏";
  return `<span class="rg">${icon}${esc(r)}${a.country&&r!=="国内"?"・"+esc(a.country):""}</span>`;
}
/* ====== 公式メディア（YouTube・Instagram・X の公式埋め込み）。無料素材写真は使わない ====== */
function ytId(a){ const m=a.media||{}; return (m.type==="youtube" && /^[A-Za-z0-9_-]{11}$/.test(m.id||"")) ? m.id : ""; }
function phsHTML(a){ return `<div class="phs" style="background:${gradient(a.headline)}"><span>${esc((a.tags&&a.tags[0])||a.category||'NEWS')}</span></div>`; }
function mediaThumb(a){
  const id=ytId(a);
  if(!id) return phsHTML(a);
  return `<div class="thumbwrap" style="background:${gradient(a.headline)}"><img class="thumb" src="https://i.ytimg.com/vi/${id}/mqdefault.jpg" loading="lazy" alt="" onerror="this.style.display='none'"><span class="playbadge">▶ 動画</span></div>`;
}
function mediaBlock(a){
  const m=a.media||{}; const id=ytId(a);
  if(id) return `<div class="ytwrap" style="background:${gradient(a.headline)}" onclick="playYT(this,'${id}')"><img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="" onerror="this.style.display='none'"><span class="ytplay">▶</span></div>`;
  if(m.type==="instagram" && /^https:\/\/www\.instagram\.com\/(p|reel)\/[A-Za-z0-9_-]+\/?$/.test(m.url||""))
    return `<div class="embedwrap"><blockquote class="instagram-media" data-instgrm-permalink="${esc(m.url)}" data-instgrm-version="14" style="margin:0 auto;max-width:540px;width:100%;min-width:260px"><a href="${esc(m.url)}" target="_blank" rel="noopener">Instagramで見る</a></blockquote></div>`;
  if(m.type==="x" && /^https:\/\/(x|twitter)\.com\/[A-Za-z0-9_]+\/status\/\d+\/?$/.test(m.url||""))
    return `<div class="embedwrap"><blockquote class="twitter-tweet" data-dnt="true" data-lang="ja"><a href="${esc(m.url.replace(/^https:\/\/x\.com/,'https://twitter.com'))}">Xで見る</a></blockquote></div>`;
  return `<div class="dph" style="background:${gradient(a.headline)}"></div>`;
}
function mediaCredit(a){
  const m=a.media||{}; const id=ytId(a);
  const label={youtube:"公式YouTube",instagram:"公式Instagram",x:"公式X"}[m.type];
  if(!label || (m.type==="youtube" && !id) || (m.type!=="youtube" && !m.url)) return "";
  const url = m.type==="youtube" ? `https://www.youtube.com/watch?v=${id}` : m.url;
  return `<div class="credit">${label}${m.owner?"："+esc(m.owner):""}　<a href="${esc(url)}" target="_blank" rel="noopener">元の投稿を開く</a></div>`;
}
function playYT(el,id){ el.outerHTML=`<div class="ytframe"><iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&playsinline=1&rel=0" title="YouTube" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`; }
function loadScript(src){ return new Promise(r=>{ if(document.querySelector(`script[src="${src}"]`)) return r(); const s=document.createElement("script"); s.src=src; s.async=true; s.onload=r; s.onerror=r; document.body.appendChild(s); }); }
async function activateEmbeds(){
  const box=document.getElementById("detailBody");
  if(box.querySelector(".instagram-media")){ await loadScript("https://www.instagram.com/embed.js"); try{ window.instgrm && window.instgrm.Embeds.process(); }catch(e){} }
  if(box.querySelector(".twitter-tweet")){ await loadScript("https://platform.twitter.com/widgets.js"); try{ window.twttr && window.twttr.widgets && window.twttr.widgets.load(box); }catch(e){} }
}
window.playYT=playYT;

/* ====== デザイン版：公式の写真・動画を1記事に複数並べる ====== */
function mediaItems(a){
  const list = (Array.isArray(a.media_list) && a.media_list.length) ? a.media_list : (a.media ? [a.media] : []);
  const seen = new Set(), out = [];
  for(const m of list){ if(!m) continue; const k = m.url || m.id || ""; if(!k || seen.has(k)) continue; seen.add(k); out.push(m); }
  return out;
}
function vimeoOK(m){ return m && m.type==="vimeo" && /^\d{5,12}$/.test(String(m.id||"")); }
function vimeoFrame(m){ return `<div class="ytframe"><iframe src="https://player.vimeo.com/video/${m.id}?dnt=1" title="Vimeo" loading="lazy" allow="fullscreen; picture-in-picture" allowfullscreen></iframe></div>`; }
function vimeoCredit(m){ return vimeoOK(m) ? `<div class="credit">公式Vimeo${m.owner?"："+esc(m.owner):""}　<a href="https://vimeo.com/${m.id}" target="_blank" rel="noopener">元の投稿を開く</a></div>` : ""; }
function mediaEmbed(m){
  if(vimeoOK(m)) return vimeoFrame(m);
  const h = mediaBlock({headline:"", media:m});
  return h.includes('class="dph"') ? "" : h;
}
function galleryItem(m){
  const e = mediaEmbed(m); if(!e) return "";
  return `<figure class="gitem">${e}${m.caption?`<div class="gcap">${esc(m.caption)}</div>`:""}${mediaCredit({media:m}) || vimeoCredit(m)}</figure>`;
}
function heroMedia(a){ return mediaItems(a)[0] || {}; }
function heroHTML(a){ const m = heroMedia(a); return vimeoOK(m) ? vimeoFrame(m) : mediaBlock(Object.assign({}, a, {media:m})); }
function heroCredit(a){ const m = heroMedia(a); return mediaCredit({media:m}) || vimeoCredit(m); }
function designThumb(a){ return mediaThumb(Object.assign({}, a, {media: heroMedia(a)})); }
function bodyWithGallery(a){
  const items = mediaItems(a).slice(heroQuote(a) ? 0 : 1).map(galleryItem).filter(Boolean);   // 1件目は記事トップで使用
  const html = withQuotes(md(a.body), a);
  if(!items.length) return html;
  const parts = html.split("<h2>");                 // parts[1]=概要, [2]=コンセプト, [3]=空間と素材, [4]=体験と運営, [5]=何が新しいか
  for(const [j,n] of [[3,2],[2,1],[4,1],[5,1]]){ if(j < parts.length){ for(let c=0; c<n && items.length; c++) parts[j] += items.shift(); } }
  if(items.length){
    const g = `<h3 class="gtitle">公式の写真・動画</h3>` + items.join("");
    const t = parts.findIndex(x => x.startsWith("立場別の示唆"));
    if(t > 1) parts[t-1] += g; else parts[parts.length-1] += g;
  }
  return parts.join("<h2>");
}

/* ====== 公式サイトの写真（引用・プレス素材）：本文の該当章に、出典付き・切り抜きなしで表示 ====== */
function quoteFigure(q, hero){
  if(!q || !/^https:\/\//.test(q.img||"") || !/^https?:\/\//.test(q.page||"")) return "";
  const kind = q.kind==="プレス素材" ? "プレス素材" : "引用";
  return `<figure class="qfig${hero?' qhero':''}"><img src="${esc(q.img)}" alt="${esc(q.caption||'')}" loading="lazy" onerror="this.closest('figure').remove()"><figcaption>${q.caption?`<span class="qcap">${esc(q.caption)}</span>`:""}<span class="qsrc"><span class="qkind">${kind}</span>出典：<a href="${esc(q.page)}" target="_blank" rel="noopener">${esc(q.site||q.page)}</a>${q.credit?`（撮影・提供：${esc(q.credit)}）`:""}</span></figcaption></figure>`;
}
function withQuotes(html, a){
  const hq = heroQuote(a);
  const qs = Array.isArray(a.quote_photos) ? a.quote_photos.filter(q => q && q.img && q !== hq) : [];
  if(!qs.length) return html;
  const parts = html.split("<h2>");
  for(const q of qs){
    const fig = quoteFigure(q); if(!fig) continue;
    const sec = String(q.section||"").replace(/^#+\s*/,"").trim();
    let j = sec ? parts.findIndex((x,i) => i>0 && x.startsWith(sec)) : -1;
    if(j < 1) j = parts.length > 1 ? 1 : 0;
    parts[j] += fig;
  }
  return parts.join("<h2>");
}

/* ====== 公式サイトの写真を優先（1枚目を記事トップに。動画・投稿は本文へ回す） ====== */
function heroQuote(a){
  const qs = Array.isArray(a.quote_photos) ? a.quote_photos : [];
  return qs.find(q => q && /^https:\/\//.test(q.img||"") && /^https?:\/\//.test(q.page||"")) || null;
}
function embedAfterFirst(html, a){
  if(!heroQuote(a)) return html;
  const m = a.media || {};
  const block = mediaBlock(a);
  if(block.includes('class="dph"')) return html;
  const parts = html.split("<h2>");
  const fig = `<figure class="efig">${block}${mediaCredit(a)}</figure>`;
  if(parts.length > 1) parts[1] += fig; else parts[0] += fig;
  return parts.join("<h2>");
}

function row(a){
  const thumb = designThumb(a);
  const tag = (a.tags&&a.tags[0])?`<span class="tag">#${esc(a.tags[0])}</span>`:"";
  return `<div class="item ${isRead(a)?'read':''}" onclick="openDetail('${a.id}')">
    <div class="txt">
      <h3 class="ttl">${esc(a.headline)}</h3>
      <div class="sub">${regionBadge(a)}<span>${ago(a.datetime)||fmtd(a.datetime)}</span>${tag}
        <button class="save-mini ${isSaved(a.id)?'on':''}" onclick="event.stopPropagation();toggleSave('${a.id}')">${isSaved(a.id)?'★':'☆'}</button>
      </div>
    </div>
    ${thumb}
  </div>`;
}
function render(){
  let items = mode==="saved" ? saved : (cat===ALL_TAB ? ARTICLES : ARTICLES.filter(a=>a.category===cat));
  const el=document.getElementById("list");
  if(!items.length){
    el.innerHTML = mode==="saved"
      ? '<div class="empty">まだ保存した記事はありません。<br>記事の☆で後から読めます。</div>'
      : '<div class="empty">記事を準備中です。<br>毎朝6時すぎに最新の記事が並びます。</div>';
    return;
  }
  el.innerHTML = items.map(row).join("");
}

/* ====== 詳細 ====== */
function factsBox(a){
  const f=a.facts||{};
  const rows=[["設計",f.architect],["インテリア",f.interior],["所在地",f.location],["客室数",f.rooms],["開業",f.opened],["主な素材",f.materials]].filter(r=>r[1]&&String(r[1]).trim());
  if(!rows.length) return "";
  return `<div class="facts">${rows.map(r=>`<div><b>${r[0]}</b><span>${esc(String(r[1]))}</span></div>`).join("")}</div>`;
}
function openDetail(id){
  const a=ARTICLES.find(x=>x.id===id)||saved.find(x=>x.id===id); if(!a)return;
  markRead(a);   // 開いた＝既読
  const img = heroQuote(a) ? quoteFigure(heroQuote(a), true) : heroHTML(a);
  const credit = heroQuote(a) ? "" : heroCredit(a);
  const srcs=(a.sources&&a.sources.length?a.sources:(a.source_url?[{name:a.source_name,url:a.source_url}]:[])).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">🔗 ${esc(s.name||s.url)}</a>`).join("");
  document.getElementById("detailBody").innerHTML=`
    ${img}${credit}
    ${(a.photo_url||a.source_url)?`<a class="photobtn" href="${esc(a.photo_url||a.source_url)}" target="_blank" rel="noopener">📷 元記事で写真を見る</a>`:""}
    <div class="dcontent">
      <span class="dcat">${esc(a.category||'')}</span>
      <h1 class="dtitle">${esc(a.headline)}</h1>
      ${a.original_title?`<div class="otitle">原題：${esc(a.original_title)}</div>`:""}
      <div class="dmeta">${regionBadge(a)}　${esc(a.source_name||'')}　|　${fmtd(a.datetime)}</div>
      ${factsBox(a)}
      <div class="dsum">${esc(a.summary_long||a.summary_short||'')}</div>
      <div class="body">${bodyWithGallery(a)}</div>
      ${srcs?`<div class="sources"><h4>出典</h4>${srcs}</div>`:""}
      <div class="actions"><button class="btn btn-save ${isSaved(a.id)?'on':''}" id="saveBtn" onclick="toggleSave('${a.id}',true)">${isSaved(a.id)?'★ 保存済み':'☆ 保存する'}</button></div>
      <div class="ai">
        <h4>🤖 この記事についてAIに質問</h4>
        <p class="note">${AI_ENDPOINT?"気になる点を聞くと、記事内容をもとにAIが答えます。":"AI機能は準備中です。"}</p>
        <div class="qchips">
          <button onclick="ask('この記事の要点を3つ教えて','${a.id}')">要点は？</button>
          <button onclick="ask('このデザインの見どころと、なぜ効いているのかを教えて','${a.id}')">見どころは？</button>
          <button onclick="ask('日本の旅館やホテルに応用するならどうする？具体例も','${a.id}')">日本で応用するなら</button>
          <button onclick="ask('出てくる専門用語をやさしく解説して','${a.id}')">用語をやさしく</button>
          <button onclick="ask('似たデザインの考え方の事例や潮流を教えて','${a.id}')">似た事例は？</button>
        </div>
        <div class="airow"><input id="aiInput" placeholder="質問を入力…" onkeydown="if(event.key==='Enter')ask(this.value,'${a.id}')"><button onclick="ask(document.getElementById('aiInput').value,'${a.id}')">質問</button></div>
        <div class="aians" id="aiAns"></div>
      </div>
    </div>`;
  listScrollY = window.scrollY; document.getElementById("detail").classList.add("on"); pushDetailState(); activateEmbeds();
  document.getElementById("detail").scrollTo(0,0);
  document.getElementById("bnav").classList.add("hide");   // 記事を開いたらナビを隠す
}
/* 一覧のスクロール位置を覚えて、戻ったらそこへ戻す。端末の「戻る」でも一覧に戻る */
let listScrollY = 0;
function pushDetailState(){ try{ if(!(history.state && history.state.detail)) history.pushState({detail:1}, ""); }catch(e){} }
function backToList(){ if(history.state && history.state.detail){ history.back(); } else { closeDetail(); } }
window.addEventListener("popstate", ()=>{ if(document.getElementById("detail").classList.contains("on")) closeDetail(); });
try{ if(history.state && history.state.detail) history.replaceState(null, ""); }catch(e){}
function closeDetail(){
  document.getElementById("detail").classList.remove("on");
  document.getElementById("bnav").classList.remove("hide"); // 一覧に戻ったら出す
  render();                                                 // 既読の見た目を反映
  const y = listScrollY; lastY = y;                         // 開く前の位置に戻す
  window.scrollTo(0, y);
  requestAnimationFrame(()=>{ lastY = y; window.scrollTo(0, y); });
}

function toggleSave(id,inDetail){
  const a=ARTICLES.find(x=>x.id===id)||saved.find(x=>x.id===id); if(!a)return;
  if(isSaved(id)){ saved=saved.filter(x=>x.id!==id); toast("保存を解除しました"); }
  else { saved.unshift(a); toast("保存しました"); }
  persist(); render();
  if(inDetail){ const b=document.getElementById("saveBtn"); if(b){ b.className="btn btn-save "+(isSaved(id)?"on":""); b.textContent=isSaved(id)?"★ 保存済み":"☆ 保存する"; } }
}

async function ask(q,id){
  q=(q||"").trim(); if(!q)return;
  const ans=document.getElementById("aiAns");
  if(!AI_ENDPOINT){ ans.textContent="⚠️ AI機能はまだ設定されていません。"; return; }
  const a=ARTICLES.find(x=>x.id===id)||saved.find(x=>x.id===id)||{};
  ans.innerHTML='<span class="thinking">AIが考えています…</span>';
  try{
    const r=await fetch(AI_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q,title:a.headline,context:(a.summary_long||"")+"\n\n"+(a.body||"")})});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const d=await r.json(); ans.textContent=d.answer||d.text||"（回答を取得できませんでした）";
  }catch(e){ ans.textContent="通信エラーで回答できませんでした。少し待って再度お試しください。"; }
}

document.getElementById("backBtn").onclick=backToList;
window.openDetail=openDetail; window.toggleSave=toggleSave; window.ask=ask; window.setCat=setCat; window.setMode=setMode; window.load=load;

/* 一覧を下にスクロール中はナビを隠す（上に戻すと再表示） */
let lastY = 0;
window.addEventListener("scroll", ()=>{
  const nav = document.getElementById("bnav");
  if(document.getElementById("detail").classList.contains("on")) return; // 記事中は常に非表示のまま
  const y = window.scrollY;
  if(y > lastY + 8 && y > 120) nav.classList.add("hide");
  else if(y < lastY - 8) nav.classList.remove("hide");
  lastY = y;
}, {passive:true});

load(false);
if("serviceWorker" in navigator){ navigator.serviceWorker.register("./sw.js").catch(()=>{}); }
</script>
</body>
</html>
